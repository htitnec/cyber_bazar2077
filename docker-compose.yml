services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=csrf
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
  hacker:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./hack.html:/usr/share/nginx/html/hack.html
      - ./hack_transfer.html:/usr/share/nginx/html/hack_transfer.html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf